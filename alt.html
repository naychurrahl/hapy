  <style>
    :root {
      --red-50: #fef2f2;
      --red-100: #fee2e2;
      --red-400: #f87171;
      --red-500: #ef4444;
      --red-600: #dc2626;
      --red-700: #b91c1c;
      --red-800: #991b1b;
      --primary: #e75c5c;
      --secondary: #fff7ed;
      --text: #1f2937;
      --accent: #c2410c;
      --surface: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      color: var(--text);
      background: var(--surface);
    }

    .font-heading {
      font-family: "Playfair Display", Georgia, serif;
    }

    .font-body {
      font-family: "Source Sans 3", system-ui, sans-serif;
    }

    .numeral-watermark {
      font-family: "Playfair Display", Georgia, serif;
      color: var(--red-100);
      -webkit-text-stroke: 1px var(--red-100);
    }

    .surface-band {
      background: var(--secondary);
    }

    .rail-dot.active {
      background: var(--red-600);
      color: #fff;
    }

    .timeline-marker::before {
      content: "";
      position: absolute;
      left: 0.5rem;
      top: 2rem;
      bottom: -2rem;
      width: 2px;
      background: var(--red-100);
    }

    .timeline-item:last-child .timeline-marker::before {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal {
      animation: fadeIn 0.6s ease forwards;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red-100);
      border-radius: 999px;
    }
  </style>
</head>

    function renderNav() {
      const rail = document.getElementById("side-rail");
      rail.innerHTML = sections
        .filter((s) => s.id !== "cover")
        .map(
          (s) => `
        <a href="#${s.id}" data-rail="${s.id}"
          class="rail-dot flex items-center gap-2 pl-1 pr-3 py-1 rounded-full text-xs font-medium bg-white/90 shadow text-gray-600 hover:text-red-600 transition-colors">
          <span class="w-6 h-6 rounded-full flex items-center justify-center bg-red-50 text-[10px] font-heading">${s.number}</span>
          <span class="hidden xl:inline">${s.label}</span>
        </a>
      `,
        )
        .join("");

      const drawer = document.getElementById("mobile-drawer-links");
      drawer.innerHTML = sections
        .map(
          (s) => `
        <a href="#${s.id}" data-drawer="${s.id}" class="flex items-center gap-4 text-gray-700 hover:text-red-600">
          <span class="font-heading text-2xl" style="color:var(--red-300, var(--red-400));">${s.number}</span>
          <span class="text-xl font-medium">${s.label}</span>
        </a>
      `,
        )
        .join("");

      drawer.querySelectorAll("a").forEach((a) =>
        a.addEventListener("click", () => toggleDrawer(false)),
      );
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById("mobile-drawer");
      drawer.classList.toggle("hidden", !open);
      drawer.classList.toggle("flex", open);
    }

    function initScrollSpy() {
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            document.querySelectorAll("[data-rail]").forEach((el) => {
              el.classList.toggle("active", el.dataset.rail === entry.target.id);
            });
          });
        },
        { rootMargin: "-45% 0px -45% 0px" },
      );
      sections.forEach((s) => {
        const el = document.getElementById(s.id);
        if (el) observer.observe(el);
      });
    }

    function updateProgressBar() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const pct = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
      document.getElementById("scroll-progress").style.width = pct + "%";
    }

          <div class="bg-white/80 rounded-2xl p-4 shadow">
            <div class="text-xs text-gray-500 uppercase tracking-wide">CAC Reg No</div>
            <div class="font-heading text-lg text-gray-800">${site.registrationNumbers.cac}</div>
          </div>
          <div class="bg-white/80 rounded-2xl p-4 shadow">
            <div class="text-xs text-gray-500 uppercase tracking-wide">SCUML Reg No</div>
            <div class="font-heading text-lg text-gray-800">${site.registrationNumbers.scuml}</div>
          </div>
          <div class="bg-white/80 rounded-2xl p-4 shadow">
            <div class="text-xs text-gray-500 uppercase tracking-wide">Tax Clearance No</div>
            <div class="font-heading text-lg text-gray-800">${site.registrationNumbers.tax}</div>
          </div>
        </div>
      `;
    }

    function renderIntro() {
      document.getElementById("intro-content").innerHTML = `
        ${sectionHeader("intro")}
        <div class="grid lg:grid-cols-3 gap-10">
          <div class="lg:col-span-2 space-y-4 text-gray-600 leading-relaxed">
            ${introduction.paragraphs.map((p) => `<p>${p}</p>`).join("")}
          </div>
          <div class="grid grid-cols-3 lg:grid-cols-1 gap-4">
            ${introduction.gapStats
          .map(
            (stat) => `
              <div class="rounded-2xl p-4 text-center" style="background:var(--red-50);">
                <div class="font-heading text-3xl font-bold" style="color:var(--red-600);">${stat.value}</div>
                <div class="text-xs text-gray-500 uppercase tracking-wide mt-1">${stat.label}</div>
              </div>
            `,
          )
          .join("")}
          </div>
        </div>

        <h3 class="font-heading text-xl font-semibold text-gray-800 mt-16 mb-6">Legal Status & Registrations</h3>
        <div class="grid sm:grid-cols-2 gap-4">
          ${introduction.legalStatus
          .map(
            (item) => `
            <div class="flex items-start gap-3 bg-white rounded-xl p-4 shadow-sm border border-red-50">
              <span class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5" style="background:var(--red-100);color:var(--red-700);">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              </span>
              <div>
                <div class="font-medium text-gray-800 text-sm">${item.name}</div>
                <div class="text-gray-500 text-xs mt-0.5">${item.status}${item.regNo ? " · " + item.regNo : ""}</div>
              </div>
            </div>
          `,
          )
          .join("")}
        </div>

        <h3 class="font-heading text-xl font-semibold text-gray-800 mt-16 mb-6">Certificates on File</h3>
        <div id="cert-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-6"></div>
      `;

      const certGrid = document.getElementById("cert-grid");
      certGrid.innerHTML = introduction.certificates
        .map(
          (cert, i) => `
        <button onclick="openCertModal(${i})" class="bg-white rounded-2xl shadow p-4 text-center hover:shadow-lg transition-shadow">
          <img src="${cert.image}" alt="${cert.name}" class="h-32 w-full object-contain mb-3 rounded-lg" />
          <div class="text-sm font-medium text-gray-700">${cert.name}</div>
        </button>
      `,
        )
        .join("");
    }

    function renderVision() {
      const cards = [
        { label: "Vision", text: visionMission.vision },
        { label: "Mission", text: visionMission.mission },
        { label: "Aim", text: visionMission.aim },
        { label: "Motto", text: visionMission.motto },
      ];
      document.getElementById("vision-content").innerHTML = `
        ${sectionHeader("vision")}
        <div class="grid sm:grid-cols-2 gap-6 mb-16">
          ${cards
          .map(
            (c) => `
            <div class="bg-white rounded-2xl shadow-lg p-6 border-t-4" style="border-color:var(--red-400);">
              <div class="text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--red-600);">${c.label}</div>
              <p class="text-gray-600 leading-relaxed">${c.text}</p>
            </div>
          `,
          )
          .join("")}
        </div>
        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-6">Objectives</h3>
        <ol class="grid sm:grid-cols-2 gap-4">
          ${visionMission.objectives
          .map(
            (obj, i) => `
            <li class="flex items-start gap-3 bg-white rounded-xl p-4 shadow-sm">
              <span class="font-heading text-xl font-bold flex-shrink-0" style="color:var(--red-300,var(--red-400));">${String(i + 1).padStart(2, "0")}</span>
              <span class="text-gray-600 text-sm leading-relaxed">${obj}</span>
            </li>
          `,
          )
          .join("")}
        </ol>
      `;
    }

    function renderValues() {
      document.getElementById("values-content").innerHTML = `
        ${sectionHeader("values")}
        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-6">Core Values</h3>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-16">
          ${coreValues
          .map(
            (v) => `
            <div class="rounded-xl p-5" style="background:var(--red-50);">
              <div class="font-semibold" style="color:var(--red-700);">${v.title}</div>
              <div class="text-gray-500 text-sm mt-1">${v.description}</div>
            </div>
          `,
          )
          .join("")}
        </div>
        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-6">Planned Programs & Initiatives</h3>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
          ${programs
          .map(
            (p) => `
            <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col gap-3">
              <span class="text-4xl">${p.icon}</span>
              <h4 class="font-heading text-lg font-semibold text-gray-800">${p.title}</h4>
              <p class="text-gray-500 text-sm leading-relaxed">${p.description}</p>
            </div>
          `,
          )
          .join("")}
        </div>
      `;
    }

    function renderAchievements() {
      document.getElementById("achievements-content").innerHTML = `
        ${sectionHeader("achievements")}
        <div class="space-y-10">
          ${achievements
          .map(
            (a) => `
            <div class="timeline-item relative pl-10">
              <div class="timeline-marker absolute left-0 top-1 w-4 h-4 rounded-full" style="background:var(--red-600);"></div>
              <div class="text-xs font-semibold uppercase tracking-wide" style="color:var(--red-600);">${a.date}</div>
              <h4 class="font-heading text-xl font-semibold text-gray-800 mt-1">${a.title}</h4>
              <p class="text-gray-600 mt-2 leading-relaxed">${a.description}</p>
              ${a.partners
                ? `<div class="flex flex-wrap gap-2 mt-4">
                    ${a.partners
                  .map(
                    (p) => `<span class="text-xs px-3 py-1 rounded-full" style="background:var(--red-50);color:var(--red-700);">${p}</span>`,
                  )
                  .join("")}
                  </div>`
                : ""
              }
            </div>
          `,
          )
          .join("")}
        </div>
      `;
    }

    function renderLeadership() {
      document.getElementById("leadership-content").innerHTML = `
        ${sectionHeader("leadership")}
        <div class="bg-white rounded-3xl shadow-xl p-8 lg:p-10 mb-14 grid md:grid-cols-[200px_1fr] gap-8 items-center">
          ${imgWithFallback(executive.image, executive.name, "w-full aspect-square object-cover rounded-2xl shadow-lg")}
          <div>
            <span class="text-xs font-semibold uppercase tracking-wide" style="color:var(--red-600);">Executive Leadership</span>
            <h3 class="font-heading text-2xl font-bold text-gray-800 mt-1">${executive.name}</h3>
            <p class="font-medium" style="color:var(--red-700);">${executive.title}</p>
            <p class="text-gray-600 text-sm leading-relaxed mt-3">${executive.bio}</p>
          </div>
        </div>

        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-6">Board of Directors</h3>
        <div id="directors-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      `;

      document.getElementById("directors-grid").innerHTML = directors
        .map(
          (d) => `
        <button onclick="openDirectorModal(${d.id})" class="bg-white rounded-2xl shadow-lg overflow-hidden text-left hover:shadow-xl transition-shadow">
          ${imgWithFallback(d.image, d.name, "w-full aspect-[4/3] object-cover")}
          <div class="p-5">
            <h4 class="font-heading text-lg font-semibold text-gray-800">${d.name}</h4>
            <p class="text-sm mt-1" style="color:var(--red-600);">${d.title}</p>
          </div>
        </button>
      `,
        )
        .join("");
    }

    function openDirectorModal(id) {
      const d = directors.find((x) => x.id === id);
      if (!d) return;
      document.getElementById("director-modal-content").innerHTML = `
        <div class="grid md:grid-cols-[220px_1fr]">
          ${imgWithFallback(d.image, d.name, "w-full h-64 md:h-full object-cover")}
          <div class="p-8">
            <span class="text-xs text-gray-400 uppercase tracking-wide">${d.office}</span>
            <h3 class="font-heading text-2xl font-bold text-gray-800 mt-1">${d.name}</h3>
            <p class="font-medium mb-4" style="color:var(--red-600);">${d.title}</p>
            <p class="text-gray-600 text-sm leading-relaxed">${d.bio}</p>
            <h4 class="font-semibold text-gray-800 mt-6 mb-2">Team</h4>
            <ul class="grid sm:grid-cols-2 gap-1.5">
              ${d.team.map((t) => `<li class="text-gray-500 text-sm flex items-start gap-2"><span style="color:var(--red-400);">•</span>${t}</li>`).join("")}
            </ul>
          </div>
        </div>
      `;
      document.getElementById("director-modal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeDirectorModal() {
      document.getElementById("director-modal").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function openCertModal(index) {
      const cert = introduction.certificates[index];
      document.getElementById("cert-modal-title").textContent = cert.name;
      const img = document.getElementById("cert-modal-image");
      img.src = cert.image;
      img.alt = cert.name;
      document.getElementById("cert-modal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeCertModal() {
      document.getElementById("cert-modal").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function renderContact() {
      document.getElementById("contact-content").innerHTML = `
        ${sectionHeader("contact")}
        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-4">Who We Serve</h3>
        <div class="flex flex-wrap gap-2 mb-16">
          ${targetBeneficiaries
          .map(
            (b) => `<span class="text-sm px-4 py-2 rounded-full bg-white shadow-sm" style="color:var(--red-700);">${b}</span>`,
          )
          .join("")}
        </div>

        <h3 class="font-heading text-xl font-semibold text-gray-800 mb-6">Partnership & Collaboration</h3>
        <div id="partners-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6 items-stretch mb-6"></div>
        <p class="text-gray-500 text-sm max-w-3xl mb-16">
          We also collaborate with ${partners.additional.join(", ")}.
        </p>

        <div class="grid lg:grid-cols-2 gap-8">
          <div class="rounded-3xl p-8 text-white" style="background:linear-gradient(135deg,var(--red-600),var(--red-800));">
            <h3 class="font-heading text-2xl font-semibold mb-6">Contact Information</h3>
            <div class="space-y-4 text-sm">
              <div class="flex items-start gap-3"><span>📍</span><span>${site.contact.address}</span></div>
              <div class="flex items-center gap-3"><span>📞</span><span>${site.contact.phones.join(", ")}</span></div>
              <div class="flex items-center gap-3"><span>✉️</span><a href="mailto:${site.contact.email}" class="hover:underline">${site.contact.email}</a></div>
              <div class="flex items-center gap-3"><span>🌐</span><a href="${site.contact.website}" class="hover:underline">${site.contact.website}</a></div>
            </div>
          </div>
          <div class="bg-white rounded-3xl shadow-lg p-8 flex flex-col justify-center gap-4">
            <h3 class="font-heading text-2xl font-semibold text-gray-800">Ready to work with HYPA?</h3>
            <p class="text-gray-500 text-sm">Reach out to partner on screening campaigns, policy advocacy, or community outreach.</p>
            <a href="mailto:${site.contact.email}" class="inline-flex justify-center text-white px-6 py-3 rounded-full font-semibold"
              style="background:linear-gradient(135deg,var(--red-600),var(--red-700));">Email Us</a>
          </div>
        </div>
      `;

      document.getElementById("partners-grid").innerHTML = partners.logoed
        .map(
          (p) => `
        <div class="bg-white rounded-xl shadow-md p-4 flex flex-col items-center justify-center grayscale hover:grayscale-0 transition-all">
          <img src="${p.logo}" alt="${p.name}" class="h-12 object-contain mb-2" />
          <div class="text-[11px] text-gray-500 text-center">${p.name}</div>
        </div>
      `,
        )
        .join("");
    }

    function renderFooter() {
      document.getElementById("footer-line").textContent =
        `© ${new Date().getFullYear()} ${site.displayName}. ${site.tagline}.`;
    }

    // ---------------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------------

    renderNav();
    renderCover();
    renderIntro();
    renderVision();
    renderValues();
    renderAchievements();
    renderLeadership();
    renderContact();
    renderFooter();
    initScrollSpy();

    window.addEventListener("scroll", updateProgressBar);
    updateProgressBar();

    document.getElementById("drawer-toggle").addEventListener("click", () => toggleDrawer(true));
    document.getElementById("drawer-close").addEventListener("click", () => toggleDrawer(false));
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      closeDirectorModal();
      closeCertModal();
      toggleDrawer(false);
    });
  </script>
</body>

</html>
